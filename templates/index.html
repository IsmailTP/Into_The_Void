<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Into The Void</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@300;400;600&display=swap"
        rel="stylesheet">
    <meta name="view-transition" content="same-origin">
    <link rel="preload" href="/static/assets/4k.png" as="image">
</head>

<body>
    <div class="background-wrapper">
        <div class="background-image"></div>
        <div class="background-overlay"></div>
    </div>

    <header class="navbar">
        <div class="logo-container">
            <div class="target-icon">
                <div class="target-center"></div>
                <div class="target-line h-line"></div>
                <div class="target-line v-line"></div>
            </div>
            <span class="logo-text">[ INTO THE VOID ]</span>
        </div>

        <nav class="nav-links">
            <a href="/" class="nav-item active">HOME</a>
            <a href="/about" class="nav-item">ABOUT</a>
            <a href="/how-to-play" class="nav-item">HOW TO PLAY</a>
            <a href="/leaderboard" class="nav-item">LEADERBOARD</a>
            <a href="/contact" class="nav-item">CONTACT</a>
        </nav>

        <div class="nav-right">
            <a href="/login" class="terminal-btn" style="text-decoration:none; display:inline-block;">
                <span class="bracket left-bracket">[</span>
                TERMINAL LOGIN
                <span class="bracket right-bracket">]</span>
            </a>
        </div>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <div class="title-container">
                <h2 class="pre-title">INTO THE</h2>
                <h1 class="main-title" data-text="V O I D">V O I D</h1>
                <h3 class="post-title">A PROMPT IS YOUR ONLY KEY</h3>
            </div>

            <div class="description-container">
                <p>You are an explorer lost in the unknown.</p>
                <p>A system watches. A system learns.</p>
                <p>Break it, or become a part of it.</p>
            </div>

            <a href="/register" class="begin-btn" style="text-decoration: none;">
                <span class="btn-corner tl"></span>
                <span class="btn-corner tr"></span>
                <span class="btn-corner bl"></span>
                <span class="btn-corner br"></span>
                <span class="btn-text">&gt; BEGIN MISSION</span>
            </a>
        </div>
    </main>

    <div class="scroll-container">
        <div class="scroll-line"></div>
        <span class="scroll-text">SCROLL TO BEGIN</span>
    </div>
</body>

</html>
